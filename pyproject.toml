[build-system]
requires = ["setuptools>=69.5.0,<80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "action-docker-image-updater"
version = "0.1.0"
description = "GitHub Action to update Docker image references"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonpath-ng",
    "requests>=2,<3",
    "ruamel-yaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "ruff",
]

[tool.setuptools]
py-modules = ["entrypoint"]
packages = ["adiu"]

[tool.ruff]
line-length = 120
indent-width = 4

target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --disable-socket"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["entrypoint"]

[tool.coverage.report]
show_missing = true
skip_covered = true
