name: 🧪 tests

on:
  workflow_call:
  push:
    paths-ignore:
      - .github/**

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup venv
        run: |
          pip install uv
          uv sync --dev

      - name: Lint check
        run: |
          make lint-check

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup venv
        run: |
          pip install uv
          uv sync --dev

      - name: Run unit tests
        run: |
          make test

      - name: Force local build
        run: |
          sed -i 's/^  image\:.*/  image\: Dockerfile/g' action.yml  

      - name: Integration test 1
        uses: ./
        id: it1
        with:
          token: "${{ github.token }}"
          cooldown: '0'
          dry: 'true'

      - name: Integration test 2
        uses: ./
        id: it2
        with:
          token: "${{ github.token }}"
          cooldown: '0'
          file-match: '**/*.yml'
          dry: 'true'
      
      - name: Integration test 3
        uses: ./
        id: it3
        with:
          token: "${{ github.token }}"
          cooldown: '0'
          file-match: '**/*.yml'
          extra-fields: >
            {
              "portainer_version": "portainer/portainer-ce:?-alpine",
              "portainer_agent_version": "portainer/agent:?-alpine"
            }
          dry: 'true'

      - name: print out plan
        env:
          PLAN: ${{ steps.it2.outputs.plan }}
        run:
          echo "$PLAN"

      - name: Assert integration test
        env:
          STEPS_CONTEXT: ${{ toJson(steps) }}
        run: |
          uv run pytest tests/integration.py
